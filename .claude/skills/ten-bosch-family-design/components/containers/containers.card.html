<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body);}</style>
<div id="root"></div>
<script type="text/babel">
const { Card, Dialog, Tabs, Button } = window.TenBoschFamilyDesignSystem_b0c1b9;
function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:16}}>
      <div style={{display:'flex', gap:14}}>
        <Card arch padding="lg" ><div style={{fontFamily:'var(--font-display)', fontSize:'var(--text-lg)', fontWeight:600}}>Welcome home</div></Card>
        <Card><div style={{fontSize:'var(--text-sm)'}}>Trash goes out tonight — that's you, Sam.</div></Card>
      </div>
      <Tabs tabs={[
        {label:'Today', content: <div style={{fontSize:'var(--text-sm)'}}>Family dinner, 6pm</div>},
        {label:'This week', content: <div style={{fontSize:'var(--text-sm)'}}>3 events, 2 chores</div>},
      ]} />
      <Button variant="outline" onClick={()=>setOpen(true)}>Open dialog</Button>
      <Dialog open={open} onClose={()=>setOpen(false)} title="Delete this event?"
        actions={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button variant="danger">Delete</Button></>}>
        This can't be undone.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
