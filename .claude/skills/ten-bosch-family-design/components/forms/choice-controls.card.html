<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body);}</style>
<div id="root"></div>
<script type="text/babel">
const { Select, Checkbox, Radio, Switch } = window.TenBoschFamilyDesignSystem_b0c1b9;
function Demo() {
  const [c, setC] = React.useState(true);
  const [s, setS] = React.useState(false);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:16}}>
      <div style={{width:220}}>
        <Select label="Assign to" options={['Sam', 'Alex', 'Mom', 'Dad']} />
      </div>
      <div style={{display:'flex', gap:24, flexWrap:'wrap'}}>
        <Checkbox label="Trash out" checked={c} onChange={() => setC(!c)} />
        <Checkbox label="Dishes done" checked={false} />
        <Radio name="who" label="Sam" checked />
        <Radio name="who" label="Alex" />
        <Switch label="Chore reminders" checked={s} onChange={() => setS(!s)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
